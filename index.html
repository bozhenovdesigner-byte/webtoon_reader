<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webtoon Platform</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1><a href="index.html">Webtoon Platform</a></h1>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div id="app">
                <h2>Загрузка...</h2>
            </div>
        </div>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script>
        async function loadStories() {
            const stories = await App.loadData('generated/stories.json');
            
            if (!stories || stories.length === 0) {
                document.getElementById('app').innerHTML = `
                    <h2>Нет доступных сюжетов</h2>
                    <p>Добавьте контент в папку content/stories/</p>
                `;
                return;
            }

            let html = '<div class="story-grid">';
            
            for (const story of stories) {
                const lastEpisode = Storage.getLastEpisode();
                const isLastRead = lastEpisode && lastEpisode.storyId === story.id;
                
                html += `
                    <div class="story-card">
                        ${isLastRead ? '<div style="background:#3498db;color:white;padding:4px 8px;font-size:12px;">Продолжить чтение</div>' : ''}
                        <a href="pages/story.html?id=${story.id}">
                            <div class="story-card-content">
                                <h3 class="story-card-title">${story.title}</h3>
                                <p class="story-card-description">${story.description || 'Нет описания'}</p>
                                <p style="color:#666;font-size:14px;">Эпизодов: ${story.episodeCount}</p>
                            </div>
                        </a>
                    </div>
                `;
            }
            
            html += '</div>';
            document.getElementById('app').innerHTML = html;
        }

        loadStories();
    </script>
</body>
</html>
