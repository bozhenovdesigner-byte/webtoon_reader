<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чтение</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body>
    <div class="reader-container">
        <header class="reader-header">
            <div class="reader-links">
                <a href="../index.html" class="reader-brand">WEBTOON</a>
                <a href="#" id="backLink" class="reader-story-link">← История</a>
            </div>
            <div class="reader-title" id="episodeTitle"></div>
            <nav class="reader-nav" aria-label="Навигация по эпизодам">
                <button id="prevBtn" class="reader-btn" aria-label="Предыдущий эпизод">←</button>
                <button id="nextBtn" class="reader-btn" aria-label="Следующий эпизод">→</button>
            </nav>
        </header>

        <main class="reader-content" id="readerContent"><p class="loading reader-loading">Загрузка…</p></main>

        <footer class="reader-footer">
            <div class="reader-footer-title" id="footerEpisodeTitle"></div>
            <div class="nav-buttons">
                <button id="prevBtnFooter" class="btn btn-secondary">← Предыдущий</button>
                <a href="#" id="storyLink" class="btn btn-secondary">К истории</a>
                <button id="nextBtnFooter" class="btn">Следующий →</button>
            </div>
        </footer>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
    <script>
        let currentStory = null;
        let currentEpisode = null;
        let episodeIndex = 0;

        function setupNavigation() {
            const storyId = App.getQueryParam('story');
            const storyUrl = `story.html?id=${encodeURIComponent(storyId)}`;
            document.getElementById('backLink').href = storyUrl;
            document.getElementById('storyLink').href = storyUrl;
            document.getElementById('backLink').textContent = `← ${currentStory.title}`;

            const prevEpisode = currentStory.episodes[episodeIndex - 1];
            const nextEpisode = currentStory.episodes[episodeIndex + 1];
            const prevBtns = [document.getElementById('prevBtn'), document.getElementById('prevBtnFooter')];
            const nextBtns = [document.getElementById('nextBtn'), document.getElementById('nextBtnFooter')];

            prevBtns.forEach(btn => {
                if (!btn) return;
                btn.style.display = prevEpisode ? '' : 'none';
                if (prevEpisode) btn.onclick = () => location.href = `episode.html?story=${encodeURIComponent(storyId)}&episode=${encodeURIComponent(prevEpisode.id)}`;
            });
            nextBtns.forEach(btn => {
                if (!btn) return;
                btn.style.display = nextEpisode ? '' : 'none';
                if (nextEpisode) btn.onclick = () => location.href = `episode.html?story=${encodeURIComponent(storyId)}&episode=${encodeURIComponent(nextEpisode.id)}`;
            });
        }

        async function loadEpisode() {
            const storyId = App.getQueryParam('story');
            const episodeId = App.getQueryParam('episode');
            const content = document.getElementById('readerContent');
            if (!storyId || !episodeId) return content.innerHTML = '<p class="reader-message">Ошибка: не указан сюжет или эпизод</p>';

            const story = await App.loadData(`../generated/${storyId}.json`);
            if (!story) return content.innerHTML = '<p class="reader-message">Сюжет не найден</p>';
            currentStory = story;
            episodeIndex = story.episodes.findIndex(ep => ep.id === episodeId);
            if (episodeIndex < 0) return content.innerHTML = '<p class="reader-message">Эпизод не найден</p>';

            currentEpisode = story.episodes[episodeIndex];
            Storage.setLastEpisode(storyId, episodeId);
            Storage.setReadingPosition(`${storyId}_${episodeId}`, 0);
            document.title = `${currentEpisode.title} — ${story.title}`;
            document.getElementById('episodeTitle').textContent = currentEpisode.title;
            document.getElementById('footerEpisodeTitle').textContent = currentEpisode.title;

            let html = '';
            if (currentEpisode.cover) {
                html += `<img src="../${currentEpisode.cover}" alt="Обложка эпизода: ${currentEpisode.title}" class="episode-reader-cover">`;
            }
            html += currentEpisode.images.map((imgSrc, index) =>
                `<img src="../${imgSrc}" alt="Кадр ${index + 1}" class="reader-image" loading="lazy">`
            ).join('');
            content.innerHTML = html;
            setupNavigation();
        }
        loadEpisode();
    </script>
</body>
</html>
